 Science", "FUDMA", "Computing"], ["Architecture", "ABU Zaria", "Architecture"], ["Mass Communication", "BUK", "Business"], ["Electrical Engineering", "KSITM", "Engineering"], ["Software Engineering", "KSITM", "Computing"], ["Nursing", "BUK", "Medicine"], ["Education", "UMYUK", "Education"], ["Law", "ABU Zaria", "Law"], ["Agricultural Economics", "FUDMA", "Agriculture"], ["Pharmacy", "ABU Zaria", "Pharmacy"], ["Cybersecurity", "KSITM", "Computing"]], "A": [{"cat": "Graduates", "t": "KSITM's two best graduates receive vehicles", "d": "May 2026", "x": "Ibrahim Mai Nasara Bugaje (CGPA 4.92) and Aisha Isiaku (CGPA 4.75) were named the institute's overall best graduating students.", "s": "Katsina State Government", "u": "https://katsinastate.gov.ng/2026/05/11/governor-radda-rewards-ksitm-outstanding-students-with-vehicles/"}, {"cat": "Medicine", "t": "Katsina indigenes sweep BUK medical honours", "d": "April 2026", "x": "Dr. Abubakar Ismail Muhammad was named overall best graduating MBBS student, with more honours for Dr. Abba Bashir and Dr. Fatima Sada.", "s": "Katsina State Government", "u": "https://katsinastate.gov.ng/2026/05/01/governor-radda-celebrates-katsina-medical-students-who-swept-buk-honours/"}, {"cat": "Medicine", "t": "Top BUK medical graduates rewarded", "d": "2026", "x": "Three outstanding medical students received ₦7 million in total, three laptops and postgraduate scholarships.", "s": "Daily Trust", "u": "https://dailytrust.com/?p=1945980"}, {"cat": "Competition", "t": "Funtua students place second at I-FEST² in Tunisia", "d": "March 2026", "x": "Two Government College Funtua students and their teacher placed second overall in Environmental Science among 450 projects from 40 countries.", "s": "Katsina State Government", "u": "https://katsinastate.gov.ng/2026/03/29/governor-radda-rejoices-as-katsina-students-shine-at-i-fest%c2%b2-in-tunisia/"}, {"cat": "Technology", "t": "Scholar builds a diabetes-support AI tool", "d": "Nahda University, Egypt", "x": "Alhassan Nasir, a Katsina scholarship MBBS student, presented his Diabetes Coach AI to the state.", "s": "Blueprint", "u": "https://blueprint.ng/?p=837505"}, {"cat": "Graduates", "t": "104 first-class graduates at a Katsina university", "d": "Al-Qalam University", "x": "The vice chancellor reported 104 first-class degrees at the second combined convocation.", "s": "Leadership", "u": "https://leadership.ng/?p=179891"}], "Q": [{"t": "Debate champion at BUK"}, {"t": "Agriculture fellowship at FUDMA"}], "O": [{"tag": "Scholarship", "t": "Apply for a Katsina State scholarship", "x": "Applications are made online through the Scholarship Board's official portal, and applying is free.", "s": "Legit.ng", "u": "https://www.legit.ng/education/1720149-the-katsina-state-scholarship-what-s-worth-apply-how-meet-deadline/"}, {"tag": "Award", "t": "Academic Excellence Award for first-class graduates", "x": "The 2024/2025 package set aside ₦15 million for the State Government Award of Academic Excellence.", "s": "Inclusive News Network", "u": "https://inclusivenews.com.ng/radda-approves-%e2%82%a6677-6-million-bursary-package-allocates-%e2%82%a67-million-scholarship-for-pwds/"}, {"tag": "Inclusion", "t": "Special needs scholarship programme", "x": "₦7 million was set aside for the annual scholarship programme for students with special needs.", "s": "BusinessDay", "u": "https://businessday.ng/?p=1039358"}, {"tag": "Abroad", "t": "Foreign scholarships in specialised fields", "x": "The state sponsors students in fields such as Artificial Intelligence, Bioengineering and Medicine in China and Egypt.", "s": "Inclusive News Network", "u": "https://inclusivenews.com.ng/radda-approves-%e2%82%a6677-6-million-bursary-package-allocates-%e2%82%a67-million-scholarship-for-pwds/"}], "FT": {"Medicine": ["Five habits that carried me through clinical years: spaced repetition, past questions, ward notes, sleep, and a study partner.", "Before your first ward posting, learn the handover format, arrive early, and ask one good question a day."], "Engineering": ["Your final-year project is a portfolio piece. Pick a real local problem and document every design decision.", "Learn one design package well before graduation. Employers notice depth more than a long list of tools."], "Computing": ["Build in public: push a small project to GitHub every week. Recruiters read commit history more than CVs.", "Start with fundamentals: data structures, networking basics and SQL. Frameworks change, fundamentals last."], "Business": ["Read one annual report a month. It trains you to see how real companies make decisions.", "For internship applications, tailor the first two lines of every cover letter to the company."], "Law": ["Moot court is the best preparation for practice. Volunteer for the next round even if you are nervous.", "Read judgments, not only textbooks. Note the facts, the issue, the holding and the reasoning."], "Agriculture": ["Field experience beats theory alone. Spend one vacation on a working farm or research station.", "Agribusiness is growing: learn basic accounting alongside your crop and soil science."], "Architecture": ["Keep a sketchbook. Your best studio ideas often start as a quick drawing on the way home.", "Portfolio tip: show your process, not only final renders. Each panel should tell a story."], "Pharmacy": ["Master pharmacology with case studies: pick a drug, then walk through mechanism, dosing and interactions.", "Shadow a hospital or community pharmacist early. Patient communication is a skill you must practise."], "Education": ["Teach to learn: explain each topic to a classmate in five minutes. The gaps show up fast.", "Keep short reflections on your teaching practice. They strengthen postgraduate applications."]}, "CH": [["The march", "Opening parade", "3/2", "Contingents in matching tracksuits and tees set the tone. Students from 55 higher institutions took part in the Katsina leg of the First Katsina State Students' Week, hosted at Umaru Musa Yar'adua University, Katsina.", [["contingent", "Contingents on parade", "50% 50%"], ["team_w", "Scholars on the march", "50% 40%"], ["team_b", "A team in green tracksuits lines up", "50% 50%"], ["team_c", "Teams gather along the route", "50% 50%"], ["march", "Marching in step", "50% 50%"], ["f_flag", "Delegates gather under their flag", "50% 45%"], ["student", "Scholars in Students' Week colours", "50% 30%"]]], ["The hall", "Programme and ceremonies", "3/2", "The programme brought together quizzes, debates and academic competitions, sporting activities, cultural performances and innovation showcases. The ceremonies filled the hall with student union leaders, institution heads and guests.", [["hall", "A full hall at the ceremony", "50% 50%"], ["podium", "Addressing the hall", "50% 40%"], ["cert2", "A framed presentation on stage", "50% 50%"], ["cert1", "The framed prize, up close", "50% 40%"]]], ["Leadership", "Office of the SA", "3/2", "The Week was convened by the Office of the Special Assistant to the Governor on Student Matters to foster collaboration, promote academic excellence, encourage cultural exchange and discover talent. Student union leaders worked alongside the office through the week.", [["o_sa1", "Addressing the room", "50% 40%"], ["sa_phone", "Taking a call between sessions", "50% 35%"], ["sa_wave", "Looking up at the stage", "50% 40%"], ["o_sa3", "A handshake in the crowd", "50% 40%"], ["o_g1", "Signing at the table", "50% 45%"], ["o_g2", "Cheers from the floor", "50% 35%"]]], ["Innovation", "Innovators award", "3/2", "Innovation was a featured category. Two ₦500,000 Innovators Cash Award cheques from the Katsina State Enterprise Development Agency, dated 19 October 2026, went to Aliko Dangote University of Science and Technology, Wudil, and to Federal University Dutse. The finale also announced a Graduate Entrepreneurship Award of interest-free ₦500,000 support, and backing for innovators from the Kano and Zaria centres.", [["o_g7", "Cheque for Aliko Dangote University of Science and Technology, Wudil", "50% 50%"], ["i_dutse", "Cheque for Federal University Dutse", "50% 70%"]]], ["Prizes", "Grand finale", "3/2", "The grand finale and prize presentation was held on Tuesday 20 October 2026 at UMYU. Trophies, certificates and cash envelopes went to winners of the academic, sporting, cultural and innovation competitions.", [["t_ribbon", "Trophies wrapped in the Week's ribbons", "50% 45%"], ["t_stage", "A trophy and certificate handed over on stage", "50% 50%"], ["trophy", "A trophy and prize envelope", "50% 40%"], ["plaque", "Prizes laid out for presentation", "50% 50%"]]], ["The durbar", "Horses and regalia", "4/5", "Horsemen in full regalia, a royal parasol, silver helmets and black turbans. Katsina's heritage rode through the cultural displays.", [["horse", "On horseback in full regalia", "50% 30%"], ["prince1", "Fist raised, regalia on show", "50% 30%"], ["prince2", "Above the crowd", "50% 40%"], ["umbrella", "Under the royal parasol", "50% 50%"], ["helmet", "A silver helmet and gold collar", "50% 40%"], ["rider_bw", "A study in black and white", "50% 40%"]]], ["Culture and fashion", "Cultural displays", "4/5", "Striped cotton, coral beads, henna, embroidery and turbans. The cultural displays told the story of Katsina through what people wore.", [["girl1", "Coral beads and a cotton wrap", "50% 30%"], ["girl3", "Heritage in every detail", "50% 30%"], ["girl2", "A smile in the procession", "50% 30%"], ["girl_henna", "Henna and a wave", "50% 30%"], ["girls_white", "Embroidered white, in step", "50% 40%"], ["girl_hat", "A quiet portrait", "50% 35%"], ["o_g6", "The procession", "50% 25%"], ["mag2", "Lilac and gold", "50% 40%"]]], ["Also in October", "Breast cancer awareness", "1/1", "A breast cancer awareness walk: no one should face breast cancer alone. Pink caps and tees filled the stands and the road. This was a separate event from the Students' Week programme.", [["pink", "No one should face breast cancer", "5
